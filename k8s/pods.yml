apiVersion: v1
kind: Pod
metadata:
  name: pod-miniboard-migrate
  labels:
    run: miniboard-migrate
spec: # spec for pod
  containers:
  - name: miniboard-migrate
    image: ghcr.io/minilauta/miniboard/app:latest
    imagePullPolicy: Always
    securityContext:
      runAsNonRoot: true
      runAsUser: 82
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    workingDir: /app
    args: ["php", "src/cli.php", "migrate"]
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      # NOTE: adjust limits specifically for your environment
      # limits:
      #   memory: 256Mi
    env:
    - name: PHP_POST_MAX_SIZE
      value: 100M
    - name: PHP_UPLOAD_MAX_FILESIZE
      value: 128M
    - name: MB_TIMEZONE
      value: Europe/Helsinki
    - name: MB_DB_HOST
      value: miniboard-mariadb
    - name: MB_DB_NAME
      value: miniboard_db
    - name: MB_DB_USER
      valueFrom:
        secretKeyRef:
          name: miniboard-mariadb-user
          key: USER
    - name: MB_DB_PASS
      valueFrom:
        secretKeyRef:
          name: miniboard-mariadb-user
          key: PASSWORD
    - name: REDIS_HOST
      value: miniboard-redis
    - name: REDIS_PASS
      valueFrom:
        secretKeyRef:
          name: miniboard-redis-auth
          key: PASSWORD
    - name: FILE_SCANNER_HOST
      value: miniboard-file-scanner
    # NOTE: migrate imports the legacy config.php into the empty config table
    - name: MB_LEGACY_CONFIG
      value: /app/legacy/config.php
    volumeMounts:
    - name: miniboard-app-config
      mountPath: /app/legacy/config.php
      subPath: config.php
      readOnly: true
  restartPolicy: OnFailure
  volumes:
  - name: miniboard-app-config
    configMap:
      name: miniboard-app-config
      items:
      - key: config.php
        path: config.php

