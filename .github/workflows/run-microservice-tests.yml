name: Run microservice tests

on:
  push:
    branches:
      - 'master'
    paths:
      - 'microservices/file-scanner/**'
      - '.github/workflows/run-microservice-tests.yml'
  pull_request:
    paths:
      - 'microservices/file-scanner/**'
      - '.github/workflows/run-microservice-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build file-scanner image
        run: docker compose build file-scanner
      - name: Run Python unit tests
        run: >
          docker compose run --no-deps
          --user root
          --name file-scanner_test
          file-scanner
          bash -c '. /opt/venv/bin/activate && python -m unittest'
